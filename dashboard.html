<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>School Ranking System</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d4b5e0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    
    <style>
        /* ===== CSS Variables - Light Purple Theme ===== */
        :root {
            --primary: #b39ddb;
            --primary-dark: #9575cd;
            --primary-light: #d4c5e8;
            --primary-bg: #f3edf8;
            --primary-gradient: linear-gradient(135deg, #b39ddb 0%, #9575cd 100%);
            --bg: #f7f2fc;
            --card-bg: #ffffff;
            --text-primary: #2c3e50;
            --text-secondary: #7f8c8d;
            --shadow: 0 2px 12px rgba(155, 89, 182, 0.12);
            --radius: 16px;
            --transition: all 0.3s ease;
            --border-color: #e8dff0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            padding-bottom: 70px;
            color: var(--text-primary);
        }

        /* ===== Header ===== */
        .header { 
            background: var(--primary-gradient);
            color: white;
            padding: 12px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { 
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header p { 
            font-size: 11px;
            opacity: 0.9;
            margin-top: 2px;
        }
        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .header-btn { 
            background: rgba(255,255,255,0.2);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.3);
            transition: var(--transition);
            color: white;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .header-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        /* ===== Container & Cards ===== */
        .container { 
            max-width: 1200px;
            margin: 0 auto;
            padding: 12px;
        }
        
        .card { 
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
            transition: var(--transition);
            border: 1px solid var(--border-color);
        }
        .card:hover {
            box-shadow: 0 4px 20px rgba(155, 89, 182, 0.15);
        }
        .card-title { 
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-primary);
            border-left: 4px solid var(--primary-dark);
            padding-left: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .card-title .actions {
            display: flex;
            gap: 6px;
        }

        /* ===== Buttons ===== */
        .btn { 
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-danger { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .btn-success { background: linear-gradient(135deg, #27ae60, #229954); }
        .btn-secondary { background: linear-gradient(135deg, #95a5a6, #7f8c8d); }
        .btn-warning { background: linear-gradient(135deg, #f39c12, #d68910); }
        .btn-pdf { background: linear-gradient(135deg, #dc3545, #c82333); }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary-dark);
            color: var(--primary-dark);
        }
        .btn-outline:hover {
            background: var(--primary-dark);
            color: white;
        }
        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
            width: auto;
            margin: 0;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn-group .btn {
            flex: 1;
            min-width: 100px;
        }

        /* ===== Grid & Items ===== */
        .grid { 
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 10px;
        }
        .card-item { 
            background: var(--primary-gradient);
            color: white;
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .card-item:active {
            transform: scale(0.97);
        }
        .card-item .badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255,255,255,0.25);
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 10px;
        }
        .card-item .item-actions {
            position: absolute;
            bottom: 8px;
            right: 8px;
            display: flex;
            gap: 4px;
        }
        .card-item .item-actions button {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            transition: var(--transition);
        }
        .card-item .item-actions button:hover {
            background: rgba(255,255,255,0.4);
        }
        .item-name { font-size: 14px; font-weight: 600; margin-bottom: 5px; }
        .item-info { font-size: 11px; opacity: 0.9; }

        /* ===== Student Items ===== */
        .student-item { 
            display: flex;
            align-items: center;
            padding: 10px;
            margin: 6px 0;
            background: var(--primary-bg);
            border-radius: 12px;
            transition: var(--transition);
            border: 1px solid var(--border-color);
        }
        .student-item:hover {
            background: #ede5f5;
        }
        .rank-number { 
            width: 36px;
            height: 36px;
            background: var(--primary-gradient);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 10px;
            font-size: 14px;
            flex-shrink: 0;
        }
        .rank-1 { background: #FFD700; color: #333; box-shadow: 0 0 20px rgba(255,215,0,0.3); }
        .rank-2 { background: #C0C0C0; color: #333; }
        .rank-3 { background: #CD7F32; color: white; }
        
        .student-details { flex: 1; min-width: 0; }
        .student-name { font-size: 14px; font-weight: 500; color: var(--text-primary); }
        .student-score { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

        /* ===== Forms ===== */
        .input-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 6px; font-weight: 500; color: var(--text-secondary); font-size: 13px; }
        input, textarea, select { 
            width: 100%;
            padding: 10px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            transition: var(--transition);
            background: var(--bg);
        }
        input:focus, textarea:focus, select:focus {
            border-color: var(--primary-dark);
            outline: none;
            box-shadow: 0 0 0 3px rgba(155, 89, 182, 0.1);
        }
        textarea { min-height: 80px; resize: vertical; }

        /* ===== Modal ===== */
        .modal { 
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(4px);
            animation: modalFadeIn 0.3s ease;
        }
        .modal-content { 
            background: white;
            border-radius: 20px;
            padding: 24px;
            max-width: 500px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            animation: modalSlideUp 0.3s ease;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes modalSlideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* ===== Navigation ===== */
        .bottom-nav { 
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 8px 16px 16px;
            box-shadow: 0 -2px 12px rgba(0,0,0,0.08);
            z-index: 150;
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-color);
        }
        .nav-item { 
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            background: none;
            border: none;
            font-size: 10px;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 6px 12px;
            transition: var(--transition);
            position: relative;
        }
        .nav-item.active { 
            color: var(--primary-dark);
            font-weight: 600;
        }
        .nav-item.active::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 3px;
            background: var(--primary-dark);
            border-radius: 2px;
        }
        .nav-item span:first-child { font-size: 22px; }
        
        /* ===== FAB ===== */
        .fab { 
            position: fixed;
            bottom: 80px;
            right: 16px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--primary-gradient);
            color: white;
            border: none;
            font-size: 28px;
            box-shadow: 0 4px 16px rgba(155, 89, 182, 0.3);
            cursor: pointer;
            z-index: 90;
            display: none;
            transition: var(--transition);
        }
        .fab:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 24px rgba(155, 89, 182, 0.4);
        }
        .fab:active {
            transform: scale(0.95);
        }

        /* ===== Tables ===== */
        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        .marks-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .marks-table th {
            background: var(--primary-gradient);
            color: white;
            padding: 10px;
            text-align: left;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .marks-table td {
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
        }
        .marks-table tr:hover td {
            background: var(--primary-bg);
        }
        .marks-table input {
            width: 80px;
            padding: 6px;
            text-align: center;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }
        .marks-table input:focus {
            border-color: var(--primary-dark);
        }

        /* ===== Toast ===== */
        .toast { 
            position: fixed;
            bottom: 80px;
            left: 20px;
            right: 20px;
            max-width: 400px;
            margin: 0 auto;
            background: #2c3e50;
            color: white;
            text-align: center;
            padding: 12px 20px;
            border-radius: 12px;
            z-index: 3000;
            font-size: 13px;
            animation: slideUp 0.3s ease;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        .toast-success { background: #27ae60; }
        .toast-error { background: #e74c3c; }
        .toast-warning { background: #f39c12; }
        .toast-info { background: var(--primary-dark); }
        
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* ===== Breadcrumb ===== */
        .breadcrumb { 
            margin-bottom: 12px;
            padding: 8px 12px;
            background: var(--primary-bg);
            border-radius: 10px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            border: 1px solid var(--border-color);
        }
        .breadcrumb span { 
            color: var(--primary-dark);
            cursor: pointer;
            transition: var(--transition);
        }
        .breadcrumb span:hover {
            text-decoration: underline;
        }

        /* ===== Empty State ===== */
        .empty-state { 
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
            font-size: 14px;
        }
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        /* ===== Loading ===== */
        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(155, 89, 182, 0.2);
            border-top: 3px solid var(--primary-dark);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .container { padding: 8px; }
            .card { padding: 12px; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
            .header h1 { font-size: 16px; }
            .btn-group .btn { min-width: 80px; }
            .marks-table { font-size: 11px; }
            .marks-table th, .marks-table td { padding: 6px; }
        }

        @media (max-width: 480px) {
            .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
            .card-item { padding: 12px; min-height: 70px; }
            .item-name { font-size: 12px; }
            .fab { width: 48px; height: 48px; font-size: 24px; bottom: 72px; }
            .header-btn { font-size: 10px; padding: 4px 10px; }
        }

        /* ===== Print Styles ===== */
        @media print {
            .header, .bottom-nav, .fab, .btn, .input-group { display: none !important; }
            .card { box-shadow: none; border: 1px solid #ddd; break-inside: avoid; }
        }

        /* ===== Profile Avatar ===== */
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary-gradient);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            border: 2px solid rgba(255,255,255,0.3);
        }
        .avatar:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div>
                <h1>🏆 School Ranking</h1>
                <p id="welcomeMessage">Welcome, Teacher!</p>
            </div>
            <div class="header-actions">
                <span id="onlineStatus" style="font-size: 11px; opacity: 0.8;">🟢 Online</span>
                <a href="profile.html" class="header-btn">👤 Profile</a>
                <div class="header-btn" onclick="logout()">🚪 Logout</div>
            </div>
        </div>
    </div>
    <div class="container" id="mainContainer"></div>
    <div class="bottom-nav">
        <button class="nav-item active" data-page="classes"><span>📚</span><span>Classes</span></button>
        <button class="nav-item" data-page="ranking"><span>🏆</span><span>Ranking</span></button>
        <button class="nav-item" data-page="teachers"><span>👨‍🏫</span><span>Teachers</span></button>
        <button class="nav-item" data-page="settings"><span>⚙️</span><span>Settings</span></button>
    </div>
    <button class="fab" id="fabBtn">+</button>
    <div class="modal" id="modal"><div class="modal-content" id="modalContent"></div></div>

    <script>
        // ============================================================
        // 1. FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAKTBTnSHbZ-aEzIOZZ6ElWpybD93DHXVc",
            authDomain: "school-7bfaa.firebaseapp.com",
            projectId: "school-7bfaa",
            storageBucket: "school-7bfaa.firebasestorage.app",
            messagingSenderId: "91516216765",
            appId: "1:91516216765:web:d95271f492a680308d1ed4"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ============================================================
        // 2. INDEXEDDB - LOCAL DATA STORAGE
        // ============================================================
        const localDB = localforage.createInstance({
            name: 'SchoolRankingSystem',
            storeName: 'schoolData'
        });

        // ============================================================
        // 3. SERVICE WORKER REGISTRATION
        // ============================================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('SW registered:', registration);
                    })
                    .catch(error => {
                        console.error('SW registration failed:', error);
                    });
            });

            window.addEventListener('online', () => {
                document.getElementById('onlineStatus').textContent = '🟢 Online';
                showToast('Back online! Syncing data...', 'success');
                syncData();
            });
            window.addEventListener('offline', () => {
                document.getElementById('onlineStatus').textContent = '🔴 Offline';
                showToast('You are offline. Changes will sync when online.', 'warning');
            });
        }

        // ============================================================
        // 4. GLOBAL STATE
        // ============================================================
        let currentPage = 'classes';
        let currentClass = null;
        let currentUser = null;
        let selectedSubject = null;
        let renderLock = false;
        let saveTimeout = null;
        let isOnline = navigator.onLine;

        // ============================================================
        // 5. AUTHENTICATION
        // ============================================================
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                // Redirect to login if not authenticated
                window.location.href = '/login.html';
            } else {
                currentUser = user;
                document.getElementById('welcomeMessage').innerHTML = `Welcome, ${user.displayName || user.email?.split('@')[0] || 'Teacher'}! 👋`;
                
                // Update profile link
                const profileLink = document.querySelector('a[href="profile.html"]');
                if (profileLink) {
                    profileLink.textContent = `👤 ${user.displayName?.split(' ')[0] || 'Profile'}`;
                }
                
                await loadUserData();
            }
        });

        // ============================================================
        // 6. DATA LAYER (Firestore + IndexedDB)
        // ============================================================
        async function loadUserData() {
            try {
                // Try Firestore first
                if (isOnline) {
                    const docRef = db.collection('schoolData').doc(currentUser.uid);
                    const doc = await docRef.get();
                    if (doc.exists) {
                        window.userData = doc.data();
                        await localDB.setItem(currentUser.uid, window.userData);
                        console.log('Data loaded from Firestore');
                        render();
                        return;
                    }
                }
                
                // Fallback to IndexedDB
                const cachedData = await localDB.getItem(currentUser.uid);
                if (cachedData) {
                    window.userData = cachedData;
                    console.log('Data loaded from IndexedDB (offline)');
                    render();
                    return;
                }
                
                // No data found
                window.userData = { 
                    classes: {}, 
                    settings: {}, 
                    classTeachers: {}
                };
                await saveData(window.userData);
                render();
            } catch (error) {
                console.error('Load error:', error);
                const cachedData = await localDB.getItem(currentUser.uid);
                if (cachedData) {
                    window.userData = cachedData;
                    render();
                } else {
                    window.userData = { classes: {}, settings: {}, classTeachers: {} };
                    render();
                }
            }
        }

        async function saveData(data) {
            window.userData = data;
            
            // Always save to IndexedDB (offline-first)
            try {
                await localDB.setItem(currentUser.uid, data);
                console.log('Saved to IndexedDB');
            } catch (error) {
                console.error('IndexedDB save error:', error);
            }

            // Save to Firestore if online
            if (isOnline) {
                try {
                    await db.collection('schoolData').doc(currentUser.uid).set(data);
                    console.log('Saved to Firestore');
                } catch (error) {
                    console.error('Firestore save error:', error);
                    showToast('⚠️ Saved locally only (offline)', 'warning');
                    return;
                }
            }
            
            showToast('✅ Data saved', 'success');
        }

        function debouncedSave(data) {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                saveData(data);
            }, 500);
        }

        async function syncData() {
            if (!isOnline || !currentUser) return;
            
            try {
                const cachedData = await localDB.getItem(currentUser.uid);
                if (cachedData) {
                    await db.collection('schoolData').doc(currentUser.uid).set(cachedData);
                    console.log('Synced offline data to Firestore');
                }
            } catch (error) {
                console.error('Sync error:', error);
            }
        }

        function loadData() {
            return window.userData || { classes: {}, settings: {}, classTeachers: {} };
        }

        // ============================================================
        // 7. TOAST SYSTEM
        // ============================================================
        function showToast(message, type = 'info', duration = 3000) {
            const oldToast = document.querySelector('.toast');
            if (oldToast) oldToast.remove();
            
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        // ============================================================
        // 8. RANKING LOGIC
        // ============================================================
        function getRankedStudents(classData) {
            const students = classData.students || [];
            const subjects = classData.subjects || {};
            
            const studentsWithTotals = students.map(student => {
                let total = 0;
                const subjectScores = {};
                Object.keys(subjects).forEach(subject => {
                    const marks = subjects[subject]?.marks?.[student.name] || 0;
                    subjectScores[subject] = marks;
                    total += marks;
                });
                return { ...student, total, subjectScores };
            });
            
            studentsWithTotals.sort((a, b) => b.total - a.total);
            studentsWithTotals.forEach((student, idx) => { student.rank = idx + 1; });
            return studentsWithTotals;
        }

                rankedStudents.forEach((student, idx) => {
                    const totalSubjects = subjects.length;
                    const average = totalSubjects > 0 ? (student.total / totalSubjects).toFixed(1) : 0;
                    const rankSuffix = idx === 0 ? 'st' : idx === 1 ? 'nd' : idx === 2 ? 'rd' : 'th';
                    
                    html += `
                        <tr style="${idx % 2 === 0 ? 'background: #f8f9fa;' : ''}">
                            <td style="border: 1px solid #ddd; padding: 8px; text-align: center;"><strong>${student.rank}${rankSuffix}</strong></td>
                            <td style="border: 1px solid #ddd; padding: 8px;"><strong>${escapeHtml(student.name)}</strong></td>
                            <td style="border: 1px solid #ddd; padding: 8px; text-align: center;">${student.id || 'N/A'}</td>`;
                    
                    subjects.forEach(subject => {
                        const marks = student.subjectScores[subject] || 0;
                        const color = marks >= 90 ? '#27ae60' : (marks >= 75 ? '#3498db' : (marks >= 50 ? '#f39c12' : '#e74c3c'));
                        html += `<td style="border: 1px solid #ddd; padding: 8px; text-align: center; color: ${color}; font-weight: bold;">${marks}</td>`;
                    });
                    
                    html += `
                        <td style="border: 1px solid #ddd; padding: 8px; text-align: center; font-weight: bold;">${student.total}</td>
                        <td style="border: 1px solid #ddd; padding: 8px; text-align: center;">${average}%</td>
                    </tr>`;
                });
                
                html += `
                        </tbody>
                    </table>
                    
                    <div style="margin-top: 40px; page-break-before: always;"></div>
                    
                    <h3 style="margin: 20px 0 10px 0;">📋 CSC Form (Subjects vs Students)</h3>
                    <table style="width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 11px;">
                        <thead>
                            <tr style="background: #b39ddb; color: white;">
                                <th style="border: 1px solid #ddd; padding: 10px;">Subject</th>`;
                
                students.forEach(student => {
                    html += `<th style="border: 1px solid #ddd; padding: 10px;">${escapeHtml(student.name)}</th>`;
                });
                
                html += `
                                <th style="border: 1px solid #ddd; padding: 10px;">Class Avg</th>
                            </tr>
                        </thead>
                        <tbody>`;
                
                subjects.forEach(subject => {
                    let totalMarks = 0;
                    let count = 0;
                    html += `
                        <tr>
                            <td style="border: 1px solid #ddd; padding: 10px; font-weight: bold; background: #f8f9fa;">${escapeHtml(subject)}</td>`;
                    
                    students.forEach(student => {
                        const marks = classData.subjects[subject]?.marks?.[student.name] || 0;
                        totalMarks += marks;
                        count++;
                        const color = marks >= 90 ? '#27ae60' : (marks >= 75 ? '#3498db' : (marks >= 50 ? '#f39c12' : '#e74c3c'));
                        html += `<td style="border: 1px solid #ddd; padding: 10px; text-align: center; color: ${color}; font-weight: bold;">${marks}</td>`;
                    });
                    
                    const classAvg = count > 0 ? (totalMarks / count).toFixed(1) : 0;
                    html += `
                        <td style="border: 1px solid #ddd; padding: 10px; text-align: center; background: #e8f5e9; font-weight: bold;">${classAvg}</td>
                    </tr>`;
                });
                
                html += `
                        </tbody>
                    </table>
                    
                    <div style="margin-top: 30px; text-align: center; font-size: 11px; color: #999; border-top: 1px solid #ddd; padding-top: 20px;">
                        <p>Generated by School Ranking System | Subject marks are out of 100 maximum</p>
                        <p>${students.length} students | ${subjects.length} subjects | ${teachers.length} teacher(s)</p>
                        <p>Generated on: ${new Date().toLocaleString()}</p>
                    </div>
                `;
                
                pdfDiv.innerHTML = html;
                document.body.appendChild(pdfDiv);
                
                const opt = {
                    margin: [0.5, 0.5, 0.5, 0.5],
                    filename: `${currentClass}_Report_${date.replace(/\//g, '-')}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true, logging: false },
                    jsPDF: { unit: 'in', format: 'a4', orientation: 'landscape' }
                };
                
                await html2pdf().set(opt).from(pdfDiv).save();
                showToast('PDF exported successfully!', 'success');
                
            } catch (error) {
                console.error('PDF export error:', error);
                showToast('Error generating PDF: ' + error.message, 'error');
            } finally {
                const pdfDiv = document.querySelector('[style*="left: -9999px"]');
                if (pdfDiv) pdfDiv.remove();
            }
        }

        // ============================================================
        // 16. TEACHER MANAGEMENT (From Firebase)
        // ============================================================
        async function showAddTeacherModal() {
            try {
                // Fetch all users from Firestore
                const usersSnapshot = await db.collection('users').get();
                const availableTeachers = [];
                
                usersSnapshot.forEach(doc => {
                    const userData = doc.data();
                    // Check if user is a teacher and not already assigned to this class
                    if (userData.role === 'teacher') {
                        const classTeachers = loadData().classTeachers?.[currentClass] || [];
                        if (!classTeachers.some(t => t.uid === doc.id)) {
                            availableTeachers.push({
                                uid: doc.id,
                                ...userData
                            });
                        }
                    }
                });
                
                if (availableTeachers.length === 0) {
                    document.getElementById('modalContent').innerHTML = `
                        <h3 style="margin-bottom: 12px;">👨‍🏫 No Teachers Available</h3>
                        <p style="margin-bottom: 16px; color: var(--text-secondary);">No teachers found. Teachers need to register first.</p>
                        <button class="btn btn-secondary" onclick="closeModal()">Close</button>
                    `;
                    document.getElementById('modal').style.display = 'flex';
                    return;
                }
                
                let html = `
                    <h3 style="margin-bottom: 12px;">👨‍🏫 Add Teacher to ${escapeHtml(currentClass)}</h3>
                    <div class="input-group">
                        <label>Select Teacher</label>
                        <select id="teacherSelect">
                            <option value="">Select a teacher...</option>
                `;
                
                availableTeachers.forEach(teacher => {
                    html += `<option value="${teacher.uid}">${escapeHtml(teacher.displayName || teacher.email || 'Teacher')} (${escapeHtml(teacher.email || '')})</option>`;
                });
                
                html += `
                        </select>
                    </div>
                    <button class="btn btn-success" onclick="assignTeacherToClass()">Assign Teacher</button>
                    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                `;
                
                document.getElementById('modalContent').innerHTML = html;
                document.getElementById('modal').style.display = 'flex';
                
            } catch (error) {
                console.error('Error loading teachers:', error);
                showToast('Error loading teachers: ' + error.message, 'error');
            }
        }

        async function assignTeacherToClass() {
            const select = document.getElementById('teacherSelect');
            const uid = select.value;
            
            if (!uid) {
                showToast('Please select a teacher', 'warning');
                return;
            }
            
            try {
                // Get teacher data from Firestore
                const docRef = await db.collection('users').doc(uid).get();
                const teacherData = docRef.data();
                
                if (!teacherData) {
                    showToast('Teacher not found', 'error');
                    return;
                }
                
                const data = loadData();
                if (!data.classTeachers) data.classTeachers = {};
                if (!data.classTeachers[currentClass]) data.classTeachers[currentClass] = [];
                
                // Check if already assigned
                if (data.classTeachers[currentClass].some(t => t.uid === uid)) {
                    showToast('Teacher already assigned to this class', 'warning');
                    return;
                }
                
                data.classTeachers[currentClass].push({
                    uid: uid,
                    email: teacherData.email,
                    displayName: teacherData.displayName || teacherData.email?.split('@')[0] || 'Teacher',
                    phoneNumber: teacherData.phoneNumber || ''
                });
                
                await saveData(data);
                closeModal();
                render();
                showToast(`Teacher assigned to ${currentClass}!`, 'success');
                
            } catch (error) {
                console.error('Error assigning teacher:', error);
                showToast('Error: ' + error.message, 'error');
            }
        }

        async function removeTeacherFromClass(uid) {
            if (!confirm('Remove this teacher from the class?')) return;
            
            const data = loadData();
            if (data.classTeachers && data.classTeachers[currentClass]) {
                data.classTeachers[currentClass] = data.classTeachers[currentClass].filter(t => t.uid !== uid);
                if (data.classTeachers[currentClass].length === 0) {
                    delete data.classTeachers[currentClass];
                }
                await saveData(data);
                render();
                showToast('Teacher removed from class', 'success');
            }
        }

        // ============================================================
        // 17. CLASS MANAGEMENT
        // ============================================================
        function showCreateClassModal() {
            document.getElementById('modalContent').innerHTML = `
                <h3 style="margin-bottom: 12px;">📚 Create New Class</h3>
                <div class="input-group">
                    <label>Class Name *</label>
                    <input type="text" id="className" placeholder="e.g., Standard 2, Grade 5" autofocus>
                </div>
                <div class="input-group">
                    <label>Academic Year</label>
                    <input type="text" id="academicYear" placeholder="e.g., 2024-2025">
                </div>
                <button class="btn" onclick="createClass()">Create Class</button>
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            `;
            document.getElementById('modal').style.display = 'flex';
        }

        async function createClass() {
            const className = document.getElementById('className').value.trim();
            const academicYear = document.getElementById('academicYear').value.trim();
            
            if (!className) {
                showToast('Please enter a class name', 'warning');
                return;
            }
            
            const data = loadData();
            if (!data.classes) data.classes = {};
            
            if (data.classes[className]) {
                showToast('Class already exists!', 'warning');
                return;
            }
            
            data.classes[className] = { 
                students: [], 
                subjects: {},
                academicYear: academicYear || 'Current',
                created: new Date().toISOString(),
                createdBy: currentUser.uid
            };
            
            await saveData(data);
            closeModal();
            render();
            showToast(`Class ${className} created!`, 'success');
        }

        function editClass(className) {
            const data = loadData();
            const classData = data.classes[className];
            
            document.getElementById('modalContent').innerHTML = `
                <h3 style="margin-bottom: 12px;">✏️ Edit Class</h3>
                <div class="input-group">
                    <label>Class Name *</label>
                    <input type="text" id="editClassName" value="${escapeHtml(className)}">
                </div>
                <div class="input-group">
                    <label>Academic Year</label>
                    <input type="text" id="editAcademicYear" value="${escapeHtml(classData?.academicYear || '')}">
                </div>
                <button class="btn btn-success" onclick="updateClass('${escapeHtml(className).replace(/'/g, "\\'")}')">Update</button>
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            `;
            document.getElementById('modal').style.display = 'flex';
        }

        async function updateClass(oldName) {
            const newName = document.getElementById('editClassName').value.trim();
            const academicYear = document.getElementById('editAcademicYear').value.trim();
            
            if (!newName) {
                showToast('Please enter a class name', 'warning');
                return;
            }
            
            const data = loadData();
            
            if (newName !== oldName && data.classes[newName]) {
                showToast('Class name already exists!', 'warning');
                return;
            }
            
            // Rename class
            const classData = data.classes[oldName];
            classData.academicYear = academicYear || 'Current';
            
            if (newName !== oldName) {
                delete data.classes[oldName];
                data.classes[newName] = classData;
                
                // Update classTeachers
                if (data.classTeachers && data.classTeachers[oldName]) {
                    data.classTeachers[newName] = data.classTeachers[oldName];
                    delete data.classTeachers[oldName];
                }
                
                currentClass = newName;
            }
            
            await saveData(data);
            closeModal();
            render();
            showToast(`Class updated to ${newName}`, 'success');
        }

        async function deleteClass(className) {
            if (!confirm(`Delete class "${className}" and all associated data? This cannot be undone!`)) return;
            
            const data = loadData();
            delete data.classes[className];
            if (data.classTeachers && data.classTeachers[className]) {
                delete data.classTeachers[className];
            }
            
            await saveData(data);
            if (currentClass === className) {
                currentClass = null;
            }
            render();
            showToast(`Class ${className} deleted`, 'success');
        }

        // ============================================================
        // 18. SUBJECT MANAGEMENT
        // ============================================================
        function showCreateSubjectModal() {
            const data = loadData();
            const teachers = data.classTeachers?.[currentClass] || [];
            
            let teacherOptions = '<option value="">No teacher</option>';
            teachers.forEach(teacher => {
                teacherOptions += `<option value="${teacher.uid}">${escapeHtml(teacher.displayName || teacher.email || 'Teacher')}</option>`;
            });
            
            document.getElementById('modalContent').innerHTML = `
                <h3 style="margin-bottom: 12px;">📖 Create Subject for ${escapeHtml(currentClass)}</h3>
                <div class="input-group">
                    <label>Subject Name *</label>
                    <input type="text" id="subjectName" placeholder="e.g., Mathematics, Science, English" autofocus>
                </div>
                <div class="input-group">
                    <label>Teacher</label>
                    <select id="subjectTeacherSelect">
                        ${teacherOptions}
                    </select>
                </div>
                <button class="btn" onclick="createSubject()">Create Subject</button>
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            `;
            document.getElementById('modal').style.display = 'flex';
        }

        async function createSubject() {
            const subjectName = document.getElementById('subjectName').value.trim();
            const teacherUid = document.getElementById('subjectTeacherSelect').value;
            
            if (!subjectName) {
                showToast('Please enter a subject name', 'warning');
                return;
            }
            
            const data = loadData();
            if (!data.classes[currentClass].subjects) data.classes[currentClass].subjects = {};
            
            if (data.classes[currentClass].subjects[subjectName]) {
                showToast('Subject already exists!', 'warning');
                return;
            }
            
            data.classes[currentClass].subjects[subjectName] = { 
                marks: {},
                teacher: teacherUid || null,
                created: new Date().toISOString()
            };
            
            await saveData(data);
            closeModal();
            render();
            showToast(`Subject ${subjectName} created!`, 'success');
        }

        function editSubject(subjectName) {
            const data = loadData();
            const subjectData = data.classes[currentClass].subjects[subjectName];
            const teachers = data.classTeachers?.[currentClass] || [];
            
            let teacherOptions = '<option value="">No teacher</option>';
            teachers.forEach(teacher => {
                const selected = teacher.uid === subjectData?.teacher ? 'selected' : '';
                teacherOptions += `<option value="${teacher.uid}" ${selected}>${escapeHtml(teacher.displayName || teacher.email || 'Teacher')}</option>`;
            });
            
            document.getElementById('modalContent').innerHTML = `
                <h3 style="margin-bottom: 12px;">✏️ Edit Subject</h3>
                <div class="input-group">
                    <label>Subject Name *</label>
                    <input type="text" id="editSubjectName" value="${escapeHtml(subjectName)}">
                </div>
                <div class="input-group">
                    <label>Teacher</label>
                    <select id="editSubjectTeacher">
                        ${teacherOptions}
                    </select>
                </div>
                <button class="btn btn-success" onclick="updateSubject('${escapeHtml(subjectName).replace(/'/g, "\\'")}')">Update</button>
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            `;
            document.getElementById('modal').style.display = 'flex';
        }

        async function updateSubject(oldName) {
            const newName = document.getElementById('editSubjectName').value.trim();
            const teacherUid = document.getElementById('editSubjectTeacher').value;
            
            if (!newName) {
                showToast('Please enter a subject name', 'warning');
                return;
            }
            
            const data = loadData();
            const subjects = data.classes[currentClass].subjects;
            
            if (newName !== oldName && subjects[newName]) {
                showToast('Subject already exists!', 'warning');
                return;
            }
            
            const subjectData = subjects[oldName];
            subjectData.teacher = teacherUid || null;
            
            if (newName !== oldName) {
                subjects[newName] = subjectData;
                delete subjects[oldName];
            }
            
            await saveData(data);
            closeModal();
            render();
            showToast(`Subject updated to ${newName}`, 'success');
        }

        async function deleteSubject(subjectName) {
            if (!confirm(`Delete subject "${subjectName}"? This will remove all marks for this subject.`)) return;
            
            const data = loadData();
            delete data.classes[currentClass].subjects[subjectName];
            
            await saveData(data);
            render();
            showToast(`Subject ${subjectName} deleted`, 'success');
        }

        // ============================================================
        // 24. NAVIGATION
        // ============================================================
        function selectClass(className) { 
            currentClass = className; 
            render();
            showToast(`Opened ${className}`, 'info');
        }
        
        function goBackToClasses() { 
            currentClass = null; 
            currentPage = 'classes';
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.querySelector('[data-page="classes"]').classList.add('active');
            render(); 
        }
        
        function goToRanking() { 
            currentPage = 'ranking'; 
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active')); 
            document.querySelector('[data-page="ranking"]').classList.add('active'); 
            render(); 
        }

        function closeModal() { 
            document.getElementById('modal').style.display = 'none'; 
        }

        function escapeHtml(text) { 
            if (!text) return ''; 
            const div = document.createElement('div'); 
            div.textContent = text; 
            return div.innerHTML; 
        }

        async function logout() {
            await auth.signOut();
            window.location.href = '/login.html';
        }

        // ============================================================
        // 25. NAVIGATION EVENT LISTENERS
        // ============================================================
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                currentPage = item.getAttribute('data-page');
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                item.classList.add('active');
                render();
            });
        });
        
        document.getElementById('fabBtn').addEventListener('click', () => {
            if (currentPage === 'classes') {
                if (currentClass) showCreateSubjectModal();
                else showCreateClassModal();
            } else if (currentPage === 'teachers') {
                // Refresh teachers list
                render();
            }
        });
        
        document.getElementById('modal').addEventListener('click', (e) => { 
            if (e.target === document.getElementById('modal')) closeModal(); 
        });

        // ============================================================
        // 26. INITIALIZATION
        // ============================================================
        render();
        console.log('School Ranking System v9.0 loaded!');
