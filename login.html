<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-adsense-account" content="ca-pub-5923637825725021">
    <title>Log In — Rank Master</title>
    <style>
        body { font-family: -apple-system, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; line-height: 1.7; color: #333; }
        h1 { color: #1a73e8; }
        nav a { margin-right: 15px; color: #1a73e8; text-decoration: none; }
        .login-box { background: #f9f9f9; padding: 30px; border-radius: 8px; margin: 20px 0; max-width: 400px; }
        label { display: block; margin-top: 15px; font-weight: bold; font-size: 14px; }
        input { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        button { width: 100%; padding: 12px; margin-top: 25px; background: #1a73e8; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #0d47a1; }
        footer { margin-top: 40px; border-top: 1px solid #ddd; padding-top: 20px; font-size: 14px; color: #666; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="privacy.html">Privacy Policy</a>
        <a href="terms.html">Terms</a>
        <a href="contact.html">Contact</a>
    </nav>

    <h1>🔐 Log In</h1>
    <p>Welcome back! Log in to your teacher account.</p>

    <div class="login-box">
        <label>Email</label>
        <input type="text" id="identifier" placeholder="you@example.com">
        
        <label>Password</label>
        <input type="password" id="password" placeholder="Your password">
        
        <button onclick="smartLogin()">Log In</button>

        <p style="text-align:center; margin-top:20px;">
            <a href="#" onclick="resetPassword()" style="color:#1a73e8;">Forgot password?</a>
        </p>
        <p style="text-align:center;">
            Don't have an account? <a href="register.html" style="color:#1a73e8;">Sign up</a>
        </p>
        <p style="text-align:center; font-size:12px; color:#888;">Secure login with Firebase</p>
    </div>

    <!-- Hidden container required for phone reCAPTCHA -->
    <div id="recaptcha-container"></div>

    <footer>
        
        <p><a href="privacy.html">Privacy Policy</a> | <a href="terms.html">Terms of Service</a> | <a href="contact.html">Contact</a></p>
        <p>&copy; 2026 Rank Master. All rights reserved.</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signInWithPhoneNumber, RecaptchaVerifier, sendPasswordResetEmail }
            from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAKTBTnSHbZ-aEzIOZZ6ElWpybD93DHXVc",
            authDomain: "school-7bfaa.firebaseapp.com",
            projectId: "school-7bfaa",
            storageBucket: "school-7bfaa.firebasestorage.app",
            messagingSenderId: "91516216765",
            appId: "1:91516216765:web:d95271f492a680308d1ed4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Format phone to E.164 (+265...) automatically
        function formatPhoneNumber(input) {
            let cleaned = input.replace(/[\s\-\(\)]/g, '');
            if (cleaned.startsWith('+')) return cleaned;
            if (cleaned.startsWith('265')) return '+' + cleaned;
            if (cleaned.startsWith('0')) return '+265' + cleaned.substring(1);
            if (cleaned.length === 9) return '+265' + cleaned;
            return '+' + cleaned;
        }

        window.smartLogin = async () => {
            const identifier = document.getElementById("identifier").value.trim();
            const password = document.getElementById("password").value;

            if (!identifier || !password) {
                alert("Please enter your email/phone and password.");
                return;
            }

            if (identifier.includes('@')) {
                // EMAIL LOGIN
                try {
                    await signInWithEmailAndPassword(auth, identifier, password);
                    window.location.href = "dashboard.html";
                } catch (e) {
                    alert("Email login failed: " + e.message);
                }
            } else {
                // PHONE LOGIN
                const phone = formatPhoneNumber(identifier);
                
                if (!window.recaptchaVerifier) {
                    window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', { size: 'invisible' });
                }
                
                try {
                    const confirmationResult = await signInWithPhoneNumber(auth, phone, window.recaptchaVerifier);
                    const code = prompt(`Enter the SMS code sent to ${phone}:`);
                    await confirmationResult.confirm(code);
                    window.location.href = "dashboard.html";
                } catch (e) {
                    alert("Phone login failed: " + e.message);
                }
            }
        };

        window.resetPassword = async () => {
            const identifier = document.getElementById("identifier").value.trim();
            if (!identifier.includes('@')) {
                alert("Please enter your email address above to reset your password.");
                return;
            }
            try {
                await sendPasswordResetEmail(auth, identifier);
                alert("Password reset email sent to " + identifier);
            } catch (e) {
                alert("Error: " + e.message);
            }
        };
    </script>
</body>
</html>
