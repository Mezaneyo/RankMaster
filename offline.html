<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline</title>
    <style>
        :root {
            --primary: #b39ddb;
            --primary-dark: #9575cd;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f7f2fc;
            color: #2c3e50;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        .icon { font-size: 64px; margin-bottom: 20px; }
        h1 { color: var(--primary-dark); }
        p { color: #7f8c8d; }
        .btn {
            background: linear-gradient(135deg, #b39ddb 0%, #9575cd 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📡</div>
        <h1>You're Offline</h1>
        <p>Please check your internet connection</p>
        <button class="btn" onclick="window.location.reload()">Retry</button>
    </div>
</body>
</html>
