<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - School Ranking System</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --primary: #b39ddb;
            --primary-dark: #9575cd;
            --primary-light: #d4c5e8;
            --primary-bg: #f3edf8;
            --bg: #f7f2fc;
            --border-color: #e8dff0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--primary-dark);
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 20px;
            padding: 8px 16px;
            background: white;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            transition: all 0.3s;
        }
        .back-btn:hover {
            background: var(--primary-bg);
        }
        
        .card {
            background: white;
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 2px 12px rgba(155, 89, 182, 0.1);
            border: 1px solid var(--border-color);
        }
        
        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--primary-gradient);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 600;
            margin: 0 auto 12px;
            border: 3px solid var(--primary-light);
        }
        .profile-header h2 {
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        .profile-header p {
            color: var(--text-secondary);
            font-size: 14px;
        }
        
        .input-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #555;
            font-size: 13px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
            background: var(--bg);
        }
        input:focus {
            border-color: var(--primary-dark);
            outline: none;
            box-shadow: 0 0 0 3px rgba(155, 89, 182, 0.1);
        }
        input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #b39ddb 0%, #9575cd 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 8px;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-danger {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
        }
        .btn-secondary {
            background: #95a5a6;
        }
        
        .message {
            padding: 12px;
            border-radius: 12px;
            margin-top: 12px;
            text-align: center;
            font-size: 14px;
        }
        .message-success {
            background: #d5f5e3;
            color: #27ae60;
            border: 1px solid #a9dfbf;
        }
        .message-error {
            background: #fadbd8;
            color: #e74c3c;
            border: 1px solid #f5b7b1;
        }
        .message-info {
            background: #d4e6f1;
            color: #2e86c1;
            border: 1px solid #a9cce3;
        }
        
        .hidden {
            display: none;
        }
        
        .divider {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 20px 0;
        }
        
        .role-badge {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: var(--primary-bg);
            color: var(--primary-dark);
            border: 1px solid var(--primary-light);
        }
        
        .verification-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            margin-top: 8px;
        }
        .verification-status.verified {
            color: #27ae60;
        }
        .verification-status.unverified {
            color: #f39c12;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">← Back to Dashboard</a>
        
        <div class="card">
            <div class="profile-header">
                <div class="avatar" id="avatarDisplay">👤</div>
                <h2 id="profileName">Loading...</h2>
                <p id="profileEmail">Loading...</p>
                <div style="margin-top: 8px;">
                    <span class="role-badge" id="profileRole">Teacher</span>
                </div>
                <div id="verificationStatus" class="verification-status"></div>
            </div>
            
            <hr class="divider">
            
            <form id="profileForm">
                <div class="input-group">
                    <label>Full Name *</label>
                    <input type="text" id="displayName" placeholder="Enter your full name">
                </div>
                
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="email" disabled>
                </div>
                
                <div class="input-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phoneNumber" placeholder="+1234567890">
                </div>
                
                <button type="button" class="btn" onclick="updateProfile()">💾 Update Profile</button>
            </form>
            
            <div id="profileMessage" class="hidden"></div>
            
            <hr class="divider">
            
            <button class="btn btn-secondary" onclick="changePassword()">🔑 Change Password</button>
            <button class="btn btn-danger" onclick="deleteAccount()" style="margin-top: 12px;">🗑️ Delete Account</button>
        </div>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAKTBTnSHbZ-aEzIOZZ6ElWpybD93DHXVc",
            authDomain: "school-7bfaa.firebaseapp.com",
            projectId: "school-7bfaa",
            storageBucket: "school-7bfaa.firebasestorage.app",
            messagingSenderId: "91516216765",
            appId: "1:91516216765:web:d95271f492a680308d1ed4"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let userData = null;

        // Auth state listener
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'register.html';
                return;
            }
            
            currentUser = user;
            await loadUserData();
        });

        async function loadUserData() {
            try {
                // Get user data from Firestore
                const docRef = db.collection('users').doc(currentUser.uid);
                const doc = await docRef.get();
                
                if (doc.exists) {
                    userData = doc.data();
                } else {
                    // Create user document if it doesn't exist
                    userData = {
                        uid: currentUser.uid,
                        email: currentUser.email,
                        displayName: currentUser.displayName || '',
                        phoneNumber: currentUser.phoneNumber || '',
                        role: 'teacher',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    };
                    await docRef.set(userData);
                }
                
                updateUI();
            } catch (error) {
                console.error('Error loading user data:', error);
                showMessage('Error loading profile: ' + error.message, 'error');
            }
        }

        function updateUI() {
            if (!currentUser || !userData) return;
            
            const name = userData.displayName || currentUser.displayName || 'User';
            const initials = name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
            
            document.getElementById('avatarDisplay').textContent = initials || '👤';
            document.getElementById('profileName').textContent = name;
            document.getElementById('profileEmail').textContent = currentUser.email || 'No email';
            document.getElementById('profileRole').textContent = (userData.role || 'teacher').charAt(0).toUpperCase() + (userData.role || 'teacher').slice(1);
            
            document.getElementById('displayName').value = name;
            document.getElementById('email').value = currentUser.email || '';
            document.getElementById('phoneNumber').value = userData.phoneNumber || currentUser.phoneNumber || '';
            
            // Verification status
            const statusEl = document.getElementById('verificationStatus');
            if (currentUser.emailVerified) {
                statusEl.className = 'verification-status verified';
                statusEl.innerHTML = '✅ Email verified';
            } else {
                statusEl.className = 'verification-status unverified';
                statusEl.innerHTML = '⚠️ Email not verified <a href="#" onclick="sendVerificationEmail()" style="color: var(--primary-dark);">Resend verification</a>';
            }
        }

        async function updateProfile() {
            const displayName = document.getElementById('displayName').value.trim();
            const phoneNumber = document.getElementById('phoneNumber').value.trim();
            
            if (!displayName) {
                showMessage('Please enter your full name', 'error');
                return;
            }
            
            try {
                // Update Auth profile
                await currentUser.updateProfile({
                    displayName: displayName
                });
                
                // Update Firestore
                await db.collection('users').doc(currentUser.uid).update({
                    displayName: displayName,
                    phoneNumber: phoneNumber || '',
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                // Update local userData
                userData.displayName = displayName;
                userData.phoneNumber = phoneNumber;
                
                showMessage('✅ Profile updated successfully!', 'success');
                updateUI();
                
            } catch (error) {
                console.error('Update error:', error);
                showMessage('Error updating profile: ' + error.message, 'error');
            }
        }

        async function sendVerificationEmail() {
            try {
                await currentUser.sendEmailVerification();
                showMessage('📧 Verification email sent! Please check your inbox.', 'info');
            } catch (error) {
                console.error('Verification email error:', error);
                showMessage('Error sending verification email: ' + error.message, 'error');
            }
        }

        async function changePassword() {
            const newPassword = prompt('Enter new password (minimum 6 characters):');
            if (!newPassword) return;
            
            if (newPassword.length < 6) {
                showMessage('Password must be at least 6 characters', 'error');
                return;
            }
            
            try {
                await currentUser.updatePassword(newPassword);
                showMessage('✅ Password changed successfully!', 'success');
            } catch (error) {
                console.error('Password change error:', error);
                if (error.code === 'auth/requires-recent-login') {
                    showMessage('Please sign in again before changing password.', 'error');
                    // Re-authenticate
                    const password = prompt('Please enter your current password to re-authenticate:');
                    if (password) {
                        try {
                            const credential = firebase.auth.EmailAuthProvider.credential(currentUser.email, password);
                            await currentUser.reauthenticateWithCredential(credential);
                            // Retry password change
                            await currentUser.updatePassword(newPassword);
                            showMessage('✅ Password changed successfully!', 'success');
                        } catch (reAuthError) {
                            showMessage('Re-authentication failed: ' + reAuthError.message, 'error');
                        }
                    }
                } else {
                    showMessage('Error: ' + error.message, 'error');
                }
            }
        }

        async function deleteAccount() {
            if (!confirm('⚠️ Are you sure you want to delete your account? This action cannot be undone!')) return;
            if (!confirm('All your data will be permanently deleted. Are you absolutely sure?')) return;
            
            try {
                // Delete user data from Firestore
                await db.collection('users').doc(currentUser.uid).delete();
                
                // Delete user's school data
                await db.collection('schoolData').doc(currentUser.uid).delete();
                
                // Delete the user account
                await currentUser.delete();
                
                // Redirect to register page
                window.location.href = 'register.html';
                
            } catch (error) {
                console.error('Delete account error:', error);
                
                if (error.code === 'auth/requires-recent-login') {
                    const password = prompt('Please enter your current password to confirm deletion:');
                    if (password) {
                        try {
                            const credential = firebase.auth.EmailAuthProvider.credential(currentUser.email, password);
                            await currentUser.reauthenticateWithCredential(credential);
                            // Retry deletion
                            await currentUser.delete();
                            window.location.href = 'register.html';
                        } catch (reAuthError) {
                            showMessage('Re-authentication failed: ' + reAuthError.message, 'error');
                        }
                    }
                } else {
                    showMessage('Error deleting account: ' + error.message, 'error');
                }
            }
        }

        function showMessage(message, type = 'info') {
            const el = document.getElementById('profileMessage');
            el.className = `message message-${type}`;
            el.textContent = message;
            el.classList.remove('hidden');
            
            setTimeout(() => {
                el.classList.add('hidden');
            }, 5000);
        }
    </script>
</body>
</html>
