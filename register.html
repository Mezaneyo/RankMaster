<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-adsense-account" content="ca-pub-5923637825725021">
    <title>Register - School Ranking System</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --primary: #b39ddb;
            --primary-dark: #9575cd;
            --primary-light: #d4c5e8;
            --primary-bg: #f3edf8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #b39ddb 0%, #9575cd 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .register-card {
            background: white;
            border-radius: 24px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 {
            color: var(--primary-dark);
            font-size: 28px;
        }
        .logo p {
            color: #7f8c8d;
            font-size: 14px;
            margin-top: 8px;
        }
        
        .input-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #555;
            font-size: 13px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e8dff0;
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.3s;
            background: #faf8fc;
        }
        input:focus {
            border-color: var(--primary-dark);
            outline: none;
            box-shadow: 0 0 0 3px rgba(155, 89, 182, 0.1);
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #b39ddb 0%, #9575cd 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-secondary {
            background: #95a5a6;
            margin-top: 8px;
        }
        
        .toggle-mode {
            text-align: center;
            margin-top: 16px;
            color: var(--primary-dark);
            cursor: pointer;
            font-size: 14px;
        }
        .toggle-mode:hover {
            text-decoration: underline;
        }
        
        .error-message {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 8px;
            text-align: center;
            min-height: 20px;
        }
        .success-message {
            color: #27ae60;
            font-size: 13px;
            margin-top: 8px;
            text-align: center;
            min-height: 20px;
        }
        
        .hidden {
            display: none;
        }
        
        #recaptcha-container {
            margin: 16px 0;
        }
        
        .role-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        .role-option {
            flex: 1;
            padding: 12px;
            border: 2px solid #e8dff0;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #faf8fc;
        }
        .role-option:hover {
            border-color: var(--primary);
            background: var(--primary-bg);
        }
        .role-option.selected {
            border-color: var(--primary-dark);
            background: var(--primary-bg);
            box-shadow: 0 0 0 3px rgba(155, 89, 182, 0.1);
        }
        .role-option .icon {
            font-size: 24px;
            display: block;
            margin-bottom: 4px;
        }
        .role-option .label {
            font-size: 12px;
            font-weight: 500;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="register-card">
        <div class="logo">
            <h1>🏆 School Ranking</h1>
            <p>Create your account</p>
        </div>
        
        <div id="registerForm">
            <!-- Role Selection -->
            <div class="role-selector">
                <div class="role-option selected" data-role="teacher" onclick="selectRole('teacher')">
                    <span class="icon">👨‍🏫</span>
                    <span class="label">Teacher</span>
                </div>
                <div class="role-option" data-role="admin" onclick="selectRole('admin')">
                    <span class="icon">👑</span>
                    <span class="label">Admin</span>
                </div>
            </div>
            
            <div class="input-group">
                <label>Full Name *</label>
                <input type="text" id="fullName" placeholder="Enter your full name">
            </div>
            
            <div class="input-group">
                <label>Email *</label>
                <input type="email" id="email" placeholder="teacher@email.com">
            </div>
            
            <div class="input-group">
                <label>Password *</label>
                <input type="password" id="password" placeholder="At least 6 characters">
            </div>
            
            <div class="input-group">
                <label>Phone Number (optional)</label>
                <input type="tel" id="phone" placeholder="+265 99 55 140 49">
            </div>
            
            <button class="btn" onclick="register()">Create Account</button>
            
            <div id="message" class="error-message"></div>
        </div>
        
        <div class="toggle-mode" onclick="window.location.href='login.html'">
            Already have an account? Sign In
        </div>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAKTBTnSHbZ-aEzIOZZ6ElWpybD93DHXVc",
            authDomain: "school-7bfaa.firebaseapp.com",
            projectId: "school-7bfaa",
            storageBucket: "school-7bfaa.firebasestorage.app",
            messagingSenderId: "91516216765",
            appId: "1:91516216765:web:d95271f492a680308d1ed4"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let selectedRole = 'teacher';

        function selectRole(role) {
            selectedRole = role;
            document.querySelectorAll('.role-option').forEach(el => {
                el.classList.toggle('selected', el.dataset.role === role);
            });
        }

        // Auth state listener - redirect if already logged in
        auth.onAuthStateChanged((user) => {
            if (user) {
                window.location.href = 'index.html';
            }
        });

        async function register() {
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const phone = document.getElementById('phone').value.trim();
            
            const messageEl = document.getElementById('message');
            messageEl.className = 'error-message';
            messageEl.textContent = '';
            
            // Validation
            if (!fullName) {
                messageEl.textContent = 'Please enter your full name';
                return;
            }
            
            if (!email) {
                messageEl.textContent = 'Please enter your email';
                return;
            }
            
            if (!password || password.length < 6) {
                messageEl.textContent = 'Password must be at least 6 characters';
                return;
            }
            
            try {
                // Create user with email/password
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                // Update display name
                await user.updateProfile({
                    displayName: fullName
                });
                
                // Save additional user data to Firestore
                await db.collection('users').doc(user.uid).set({
                    uid: user.uid,
                    email: email,
                    displayName: fullName,
                    phoneNumber: phone || '',
                    role: selectedRole,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                // Send email verification
                await user.sendEmailVerification();
                
                messageEl.className = 'success-message';
                messageEl.textContent = '✅ Account created! Please check your email to verify.';
                
                // Redirect after 3 seconds
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 3000);
                
            } catch (error) {
                console.error('Registration error:', error);
                messageEl.className = 'error-message';
                
                // Handle specific errors
                switch (error.code) {
                    case 'auth/email-already-in-use':
                        messageEl.textContent = 'This email is already registered. Please sign in.';
                        break;
                    case 'auth/invalid-email':
                        messageEl.textContent = 'Please enter a valid email address.';
                        break;
                    case 'auth/weak-password':
                        messageEl.textContent = 'Password is too weak. Please use at least 6 characters.';
                        break;
                    default:
                        messageEl.textContent = 'Registration failed: ' + error.message;
                }
            }
        }

        // Enter key to submit
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                register();
            }
        });
    </script>
</body>
</html>
