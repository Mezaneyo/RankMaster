<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-adsense-account" content="ca-pub-5923637825725021">
    <title>Sign Up — Rank Master</title>
    <style>
        body { font-family: -apple-system, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; line-height: 1.7; color: #333; }
        h1 { color: #1a73e8; }
        nav a { margin-right: 15px; color: #1a73e8; text-decoration: none; }
        .signup-box { background: #f9f9f9; padding: 30px; border-radius: 8px; margin: 20px 0; max-width: 450px; }
        label { display: block; margin-top: 15px; font-weight: bold; font-size: 14px; }
        input { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        button { width: 100%; padding: 12px; margin-top: 25px; background: #1a73e8; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #0d47a1; }
        footer { margin-top: 40px; border-top: 1px solid #ddd; padding-top: 20px; font-size: 14px; color: #666; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="privacy.html">Privacy Policy</a>
        <a href="terms.html">Terms</a>
        <a href="contact.html">Contact</a>
    </nav>

    <h1>👨‍🏫 Create Your Teacher Account</h1>
    <p>Sign up to start tracking student performance with Rank Master.</p>

    <div class="signup-box">
        <label>School Name</label>
        <input type="text" id="schoolName" placeholder="Your school name">

        <label>Email or Phone Number</label>
        <input type="text" id="identifier" placeholder="you@example.com or 0995514049">
        
        <label>Password</label>
        <input type="password" id="password" placeholder="At least 6 characters">
        
        <button onclick="smartSignup()">Create Account</button>

        <p style="text-align:center; margin-top:20px;">
            Already have an account? <a href="login.html" style="color:#1a73e8;">Log in</a>
        </p>
        <p style="text-align:center; font-size:12px; color:#888;">Secure signup with Firebase</p>
    </div>

    <!-- Hidden container required for phone reCAPTCHA -->
    <div id="recaptcha-container"></div>

    <footer>
        <p>&copy; 2026 Rank Master. All rights reserved.</p>
        <p><a href="privacy.html">Privacy Policy</a> | <a href="terms.html">Terms of Service</a> | <a href="contact.html">Contact</a></p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithPhoneNumber, RecaptchaVerifier, updateProfile }
            from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAKTBTnSHbZ-aEzIOZZ6ElWpybD93DHXVc",
            authDomain: "school-7bfaa.firebaseapp.com",
            projectId: "school-7bfaa",
            storageBucket: "school-7bfaa.firebasestorage.app",
            messagingSenderId: "91516216765",
            appId: "1:91516216765:web:d95271f492a680308d1ed4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Format phone to E.164 (+265...) automatically
        function formatPhoneNumber(input) {
            let cleaned = input.replace(/[\s\-\(\)]/g, '');
            if (cleaned.startsWith('+')) return cleaned;
            if (cleaned.startsWith('265')) return '+' + cleaned;
            if (cleaned.startsWith('0')) return '+265' + cleaned.substring(1);
            if (cleaned.length === 9) return '+265' + cleaned;
            return '+' + cleaned;
        }

        window.smartSignup = async () => {
            const school = document.getElementById("schoolName").value.trim();
            const identifier = document.getElementById("identifier").value.trim();
            const password = document.getElementById("password").value;

            if (!school || !identifier || !password) {
                alert("Please fill in all fields.");
                return;
            }

            if (identifier.includes('@')) {
                // EMAIL SIGNUP
                try {
                    const userCred = await createUserWithEmailAndPassword(auth, identifier, password);
                    await updateProfile(userCred.user, { displayName: school });
                    
                    // Save to Firestore for the Teachers list
                    await setDoc(doc(db, "users", userCred.user.uid), {
                        email: identifier,
                        displayName: school,
                        role: "teacher",
                        createdAt: new Date().toISOString()
                    });
                    
                    alert("Account created! You can now log in.");
                    window.location.href = "/login.html";
                } catch (e) {
                    alert("Email signup failed: " + e.message);
                }
            } else {
                // PHONE SIGNUP
                const phone = formatPhoneNumber(identifier);
                
                if (!window.recaptchaVerifier) {
                    window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', { size: 'invisible' });
                }
                
                try {
                    const confirmationResult = await signInWithPhoneNumber(auth, phone, window.recaptchaVerifier);
                    const code = prompt(`Enter the SMS code sent to ${phone}:`);
                    const result = await confirmationResult.confirm(code);
                    
                    await updateProfile(result.user, { displayName: school });
                    
                    // Save to Firestore for the Teachers list
                    await setDoc(doc(db, "users", result.user.uid), {
                        phoneNumber: phone,
                        displayName: school,
                        role: "teacher",
                        createdAt: new Date().toISOString()
                    });
                    
                    alert("Phone account created successfully!");
                    window.location.href = "dashboard.html";
                } catch (e) {
                    alert("Phone signup failed: " + e.message);
                }
            }
        };
    </script>
</body>
</html>
